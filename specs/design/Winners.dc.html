<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Winners</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14101A;color:#F2EADF;font-family:'Bricolage Grotesque',system-ui,sans-serif}
a{color:#FF9A4D}a:hover{color:#FFB880}
.ph{background:repeating-linear-gradient(135deg,#231C2C 0 12px,#1C1724 12px 24px)}
</style>
</helmet>
<div style="min-height: 100vh; background: #14101A">
  <header style="position: sticky; top: 0; z-index: 5; background: #14101A; border-bottom: 1px solid #2E2638">
    <div style="max-width: 480px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF7A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 8c3-2 6-2 9 0 3-2 6-2 9 0 0 5-2 9-5 9-2 0-3-2-4-2s-2 2-4 2c-3 0-5-4-5-9z"></path><path d="M7.5 10.5h2M14.5 10.5h2"></path></svg>
        <span style="font-weight: 800; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Halovinovo</span>
      </div>
      <span style="flex: none; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: #FF7A1A; color: #1A0F05">Winners</span>
    </div>
  </header>

  <main style="max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 20px">
    <section style="display: flex; flex-direction: column; gap: 8px; text-align: center">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #FF9A4D">Best costume [YEAR]</span>
      <h1 style="margin: 0; font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -0.03em">And the winners are…</h1>
    </section>

    <article style="border-radius: 18px; overflow: hidden; border: 3px solid #FF7A1A; background: #1E1826">
      <div class="ph" style="position: relative; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#5E5269" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        <span style="position: absolute; top: 12px; left: 12px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; padding: 4px 8px; border-radius: 6px; background: #14101A; color: #F2EADF">#07</span>
      </div>
      <div style="padding: 18px 20px; background: #FF7A1A; color: #1A0F05; display: flex; flex-direction: column; gap: 2px">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A0F05" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"></path></svg>
          1st place
        </span>
        <span style="font-size: 28px; font-weight: 800; line-height: 1.1">[WINNER NAME]</span>
        <span style="font-size: 15px">[Costume title]</span>
      </div>
    </article>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <article style="border-radius: 14px; overflow: hidden; border: 2px solid #D9CFC2; background: #1E1826; display: flex; flex-direction: column">
        <div class="ph" style="position: relative; aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5E5269" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          <span style="position: absolute; top: 8px; left: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: #14101A; color: #F2EADF">#02</span>
        </div>
        <div style="padding: 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; font-weight: 700; color: #D9CFC2">2nd place</span>
          <span style="font-size: 18px; font-weight: 800; line-height: 1.15">[WINNER NAME]</span>
          <span style="font-size: 13px; color: #B5ABC1">[Costume title]</span>
        </div>
      </article>
      <article style="border-radius: 14px; overflow: hidden; border: 2px solid #C48A5A; background: #1E1826; display: flex; flex-direction: column">
        <div class="ph" style="position: relative; aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#5E5269" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
          <span style="position: absolute; top: 8px; left: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: #14101A; color: #F2EADF">#11</span>
        </div>
        <div style="padding: 12px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; font-weight: 700; color: #D9A27A">3rd place</span>
          <span style="font-size: 18px; font-weight: 800; line-height: 1.15">[WINNER NAME]</span>
          <span style="font-size: 13px; color: #B5ABC1">[Costume title]</span>
        </div>
      </article>
    </div>

    <p style="margin: 0; text-align: center; font-size: 15px; color: #B5ABC1">Thanks to every mask that showed up tonight.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
