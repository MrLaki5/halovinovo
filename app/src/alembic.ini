# Alembic configuration. The database URL is deliberately not set here: env.py reads it
# from config.settings, so migrations always run against the same database as the app.

[alembic]
# path to migration scripts
script_location = %(here)s/alembic

# app/src goes on sys.path, so env.py can import config and orm
prepend_sys_path = %(here)s

version_path_separator = os

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
