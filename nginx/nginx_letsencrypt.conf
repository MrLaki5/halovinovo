pid         logs/nginx.pid;
error_log   stderr warn;  # Docker captures and rotates it, see compose.yml

worker_processes  auto;
# worker_connections is capped by the per-worker file-descriptor limit, which is
# 1024 by default in the container. Raise it so the 4096 below is real: a proxied
# connection costs two descriptors, one to the client and one to the backend.
worker_rlimit_nofile 8192;
daemon off;

events {
    worker_connections  4096;  # Increase the number of connections per worker
    multi_accept on;  # Enable multi_accept to accept multiple connections at once
    use epoll;  # Use epoll event method for better performance on Linux
}

http {
    access_log /dev/stdout;
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;

    # Photos are resized in the browser first, so 10 MB is generous
    client_body_buffer_size 10m;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    keepalive_timeout 65;
    keepalive_requests 100000;

    server {
        listen 80;
        server_name example.com;

        # Lets encrypt challenge location, used by the renewal cron job
        location ~ /\.well-known/acme-challenge/(.*) {
            allow all;
            root /var/www/certbot;
        }

        # Redirect HTTP to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server{
        listen 443 ssl;
        server_name example.com;

        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        # Mask photos: written by the app under random names, so they never change
        location /uploads/ {
            alias /var/www/uploads/;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        location / {
            proxy_pass http://app:8013;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 15s;  # Limit time to establish a connection to the backend
        }

        # Lets encrypt challenge location
        location ~ /\.well-known/acme-challenge/(.*) {
            allow all;
            root /var/www/certbot;
        }
    }
}
